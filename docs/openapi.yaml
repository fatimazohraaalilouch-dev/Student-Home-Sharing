        budgetMax: {type: number}
        maxDistanceKm: {type: number}
        preferredTypes: {type: array, items: {$ref: '#/components/schemas/ListingType'}}
        requiredAmenities: {type: array, items: {$ref: '#/components/schemas/AmenityCode'}}
