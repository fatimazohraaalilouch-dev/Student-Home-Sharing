openapi: 3.0.3
info:
  title: Home Sharing - API M1
  version: 1.0.0
  description: Authentification, gestion des annonces, preuves du propriétaire et signalements.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Listings
  - name: Owner proofs
  - name: Reports
paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Créer un compte TENANT ou OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, role]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password, minLength: 10}
                fullName: {type: string, maxLength: 160}
                role: {type: string, enum: [TENANT, OWNER]}
                phone: {type: string, maxLength: 30}
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '409': {description: Adresse e-mail déjà utilisée}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Se connecter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /listings:
    get:
      tags: [Listings]
      security: []
      summary: Lister les annonces publiées
      parameters:
        - {in: query, name: city, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListingPage'}
    post:
      tags: [Listings]
      summary: Créer une annonce en brouillon (OWNER)
      description: ownerId est déterminé depuis le jeton ; le statut initial est DRAFT.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingInput'}
      responses:
        '201':
          description: Brouillon créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Listing'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /listings/mine:
    get:
      tags: [Listings]
      summary: Consulter les annonces du propriétaire connecté
      responses:
        '200':
          description: Annonces personnelles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Listing'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /listings/{listingId}:
    parameters:
      - {$ref: '#/components/parameters/ListingId'}
    get:
      tags: [Listings]
      security: []
      summary: Consulter une annonce publiée ou sa propre annonce
      responses:
        '200':
          description: Annonce trouvée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Listing'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Listings]
      summary: Modifier une annonce (propriétaire uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingInput'}
      responses:
        '200':
          description: Annonce modifiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Listing'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Listings]
      summary: Supprimer une annonce (propriétaire uniquement)
      responses:
        '204': {description: Annonce supprimée}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /listings/{listingId}/submit:
    parameters:
      - {$ref: '#/components/parameters/ListingId'}
    post:
      tags: [Listings]
      summary: Soumettre une annonce à la vérification
      description: Les champs obligatoires et le dépôt de preuve doivent être présents. Statut cible UNDER_REVIEW.
      responses:
        '202': {description: Annonce soumise}
        '409': {description: Annonce incomplète ou preuve absente}
        '403': {$ref: '#/components/responses/Forbidden'}
  /listings/{listingId}/photos:
    parameters:
      - {$ref: '#/components/parameters/ListingId'}
    post:
      tags: [Listings]
      summary: Ajouter une photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                position: {type: integer, minimum: 0}
      responses:
        '201': {description: Photo ajoutée}
        '403': {$ref: '#/components/responses/Forbidden'}
  /listings/{listingId}/proofs:
    parameters:
      - {$ref: '#/components/parameters/ListingId'}
    post:
      tags: [Owner proofs]
      summary: Déposer une preuve du droit de location
      description: Fichier stocké en privé. Le chemin interne n'est jamais renvoyé au client.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documentType, file]
              properties:
                documentType:
                  type: string
                  enum: [TITLE_DEED, PURCHASE_CONTRACT, LEASE_WITH_SUBLET_AUTHORIZATION, POWER_OF_ATTORNEY, OTHER]
                file: {type: string, format: binary}
      responses:
        '202':
          description: Preuve reçue, statut initial PENDING
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerProof'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      tags: [Owner proofs]
      summary: Consulter l'historique et le statut des preuves de sa propre annonce
      responses:
        '200':
          description: Historique sans file_ref
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OwnerProof'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /listings/{listingId}/reports:
    parameters:
      - {$ref: '#/components/parameters/ListingId'}
    post:
      tags: [Reports]
      summary: Signaler une annonce
      description: Un utilisateur ne peut signaler une annonce qu'une fois. 3 signalements valides de 3 comptes distincts en 24 h déclenchent SUSPENDED ; seuil configurable et contrôles anti-abus requis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [SCAM, WRONG_INFORMATION, UNAUTHORIZED_PROPERTY, INAPPROPRIATE_CONTENT, OTHER]
                details: {type: string, maxLength: 2000}
      responses:
        '201': {description: Signalement enregistré}
        '409': {description: Déjà signalé par cet utilisateur}
        '404': {$ref: '#/components/responses/NotFound'}
  /listings/{listingId}/reactivation-request:
    parameters:
      - {$ref: '#/components/parameters/ListingId'}
    post:
      tags: [Listings]
      summary: Demander la réactivation d'une annonce suspendue
      description: Après correction, l'annonce passe en UNDER_REVIEW ; publication seulement si preuve VERIFIED et contrôles réussis.
      responses:
        '202': {description: Demande reçue, nouvelle vérification lancée}
        '409': {description: Annonce non suspendue ou corrections non effectuées}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ListingId:
      in: path
      name: listingId
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest: {description: Requête invalide}
    Unauthorized: {description: Authentification requise ou jeton invalide}
    Forbidden: {description: Accès interdit}
    NotFound: {description: Ressource introuvable}
  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, example: 3600}
        user:
          type: object
          properties:
            id: {type: string, format: uuid}
            email: {type: string, format: email}
            fullName: {type: string}
            role: {type: string, enum: [TENANT, OWNER]}
    ListingInput:
      type: object
      required: [title, description, propertyType, priceMonthly, addressText, city, availableFrom]
      properties:
        title: {type: string, maxLength: 150}
        description: {type: string}
        propertyType: {type: string}
        priceMonthly: {type: number, format: double, minimum = 0, exclusiveMinimum: true}
        chargesIncluded: {type: boolean, default: false}
        depositAmount: {type: number, minimum: 0}
        addressText: {type: string}
        city: {type: string}
        surfaceM2: {type: number, minimum: 0}
        bedrooms: {type: integer, minimum: 0}
        furnished: {type: boolean}
        amenities: {type: array, items: {type: string}}
        availableFrom: {type: string, format: date}
    Listing:
      allOf:
        - {$ref: '#/components/schemas/ListingInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            ownerId: {type: string, format: uuid}
            status: {type: string, enum: [DRAFT, UNDER_REVIEW, PUBLISHED, ON_HOLD, SUSPENDED]}
            suspensionReason: {type: string, nullable: true}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    ListingPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Listing'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    OwnerProof:
      type: object
      properties:
        id: {type: string, format: uuid}
        listingId: {type: string, format: uuid}
        documentType: {type: string, enum: [TITLE_DEED, PURCHASE_CONTRACT, LEASE_WITH_SUBLET_AUTHORIZATION, POWER_OF_ATTORNEY, OTHER]}
        status: {type: string, enum: [PENDING, VERIFIED, TO_COMPLETE, INCONSISTENT]}
        reason: {type: string, nullable: true}
        consistencyScore: {type: number, minimum: 0, maximum: 100, nullable: true}
        submittedAt: {type: string, format: date-time}
        verifiedAt: {type: string, format: date-time, nullable: true}
